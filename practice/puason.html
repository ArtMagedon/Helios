<html lang="ru">

<head>
</head>

<body>
    <h4>artmagedon</h4>
    <h1 id="A"></h1>
    <h1 id="B"></h1>
</body>
<script>
    const query = location.search.slice(1);
    const params = query.split("&");
    const a = params[0].split("=")[1].split(",").map(Number);
    const b = params[1].split("=")[1].split(",").map(Number);
    const avgA = a.reduce((s, x) => s + x, 0) / a.length;
    const avgB = b.reduce((s, x) => s + x, 0) / b.length;
    const numerator = a.reduce((s, x, i) => s + (x - avgA) * (b[i] - avgB), 0);
    const denominator = Math.sqrt(
        a.reduce((s, x) => s + (x - avgA) ** 2, 0) *
        b.reduce((s, x) => s + (x - avgB) ** 2, 0)
    );
    const r = numerator / denominator;
    const result = Math.abs(r);
    const answer = result >= 1 ? "1" : result.toFixed(4).slice(0, 5);
    document.title = answer;
</script>

</html>

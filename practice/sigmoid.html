<!DOCTYPE html>
<html>

<head>
</head>

<body>
    <h4>artmagedon</h4>

</body>
<script>
    const query = location.search.slice(1);
    const params = query.split("&");
    const a = params[0].split("=")[1].split(",").map(Number);
    const b = params[1].split("=")[1].split(",").map(Number);
    const c = Number(params[2].split("=")[1]);
    let z = c;
    for (let i = 0; i < a.length; i++) {
        z += a[i] * b[i]
    }
    const q = 1 / (1 + (Math.E ** (z * -1)))
    
    document.title =  q >= 1 ? "1" : q.toFixed(4).slice(0, 5);

</script>

</html>
